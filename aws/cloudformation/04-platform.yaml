AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Health Telemetry Simulator — platform stack.
  Creates ALB, ECS cluster, IAM roles, and the backend task definition.
  BackendService lives in 05-service to allow independent redeployments.
  Depends on: 02-network (VPC + security groups), 03-persistent (ECR).
  Database: SQLite on ECS ephemeral storage (no PostgreSQL sidecar or EFS needed).
  Ingestion pipeline: external Docker-on-EC2 PoC at ingestion-pipeline.aleksandr-mordanov.click

# ─── Parameters ───────────────────────────────────────────────────────────────

Parameters:

  ProjectName:
    Type: String
    Default: health-simulator

  BackendImage:
    Type: String
    Description: >
      Full ECR image URI with tag, e.g. <ECRRepositoryUri>:latest.
      Set to PLACEHOLDER on first bootstrap; updated by the docker step.
    Default: PLACEHOLDER

  ECRRepositoryUri:
    Type: String
    Description: ECR repository URI from the 03-persistent stack output.

  VPCId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID from the 02-network stack output.

  PublicSubnet1Id:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet in AZ 1 from the 02-network stack output.

  PublicSubnet2Id:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet in AZ 2 from the 02-network stack output.

  ALBSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: ALB security group from the 02-network stack output.

  ECSSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: ECS security group from the 02-network stack output.

  SeedDeviceCount:
    Type: Number
    Default: 1000
    Description: Number of synthetic devices seeded into the DB on startup.

  CertApprovalDelaySecs:
    Type: Number
    Default: 5

  DefaultHttpEndpoints:
    Type: String
    Default: "ingestion::http://ingestion-pipeline.aleksandr-mordanov.click:9000/ingest"
    Description: >
      Comma-separated name::url pairs for HTTP send targets pre-populated in the UI.
      Points to the ingestion pipeline PoC running Docker on EC2.

  DefaultMqttBrokerUrl:
    Type: String
    Default: "mqtt://ingestion-pipeline.aleksandr-mordanov.click:1883"
    Description: MQTT broker URL — Mosquitto on the ingestion pipeline EC2 instance.

  DefaultMqttTopic:
    Type: String
    Default: "health/telemetry"

  DefaultBatchSize:
    Type: Number
    Default: 10

  DefaultIntervalSeconds:
    Type: Number
    Default: 5

  DefaultMaxDevices:
    Type: Number
    Default: 200

  DefaultAnomalyRate:
    Type: String
    Default: "0.02"

  IngestionApiKey:
    Type: String
    Default: "dev-key"
    Description: >
      API key sent in X-API-Key header when the simulator registers devices
      with the ingestion pipeline POST /api/v1/devices endpoint.

  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]

  TaskCpu:
    Type: String
    Default: "1024"
    AllowedValues: ["512", "1024", "2048", "4096"]

  TaskMemory:
    Type: String
    Default: "2048"
    AllowedValues: ["1024", "2048", "3072", "4096"]

# ─── Resources ────────────────────────────────────────────────────────────────

Resources:

  # ══ ALB ════════════════════════════════════════════════════════════════════

  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ProjectName}-alb"
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnet1Id
        - !Ref PublicSubnet2Id
      SecurityGroups:
        - !Ref ALBSecurityGroupId

  BackendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ProjectName}-backend-tg"
      VpcId: !Ref VPCId
      Protocol: HTTP
      Port: 8000
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BackendTargetGroup

  AppConfigSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${ProjectName}/app-config-params"
      Description: Backend application configuration (dotenv format).
      SecretString: |
        LOG_LEVEL=info
        DEFAULT_BATCH_SIZE=10
        DEFAULT_INTERVAL_SECONDS=5
        DEFAULT_MAX_DEVICES=200
        DEFAULT_ANOMALY_RATE=0.02

  CACertPemSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${ProjectName}/ca-cert-pem"
      Description: >
        PEM-encoded CA certificate for X.509/JITR device simulation.
        Populated by bootstrap.sh after stack creation (initial value is a secretplaceholder).
      SecretString: "SECRETPLACEHOLDER"

  CAKeyPemSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${ProjectName}/ca-key-pem"
      Description: >
        PEM-encoded CA private key for X.509/JITR device simulation.
        Populated by bootstrap.sh after stack creation (initial value is a secretplaceholder).
      SecretString: "SECRETPLACEHOLDER"

  # ══ ECS ════════════════════════════════════════════════════════════════════

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ProjectName}-cluster"
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1

  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}-backend"
      RetentionInDays: !Ref LogRetentionDays

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-ecs-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${ProjectName}/*"

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-ecs-task-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  BackendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-backend"
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:

        # ── FastAPI backend ──────────────────────────────────────────────────
        - Name: backend
          Image: !Ref BackendImage
          Essential: true
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          Environment:
            - Name: BACKEND_HOST
              Value: "0.0.0.0"
            - Name: BACKEND_PORT
              Value: "8000"
            - Name: LOG_LEVEL
              Value: info
            - Name: SIMULATOR_CLOUD_MODE
              Value: "true"
            - Name: SEED_DEVICE_COUNT
              Value: !Sub "${SeedDeviceCount}"
            - Name: DATABASE_URL
              Value: "sqlite+aiosqlite:////app/simulator.db"
            - Name: CERT_APPROVAL_DELAY_SECONDS
              Value: !Sub "${CertApprovalDelaySecs}"
            - Name: CERT_VALIDITY_DAYS
              Value: "365"
            - Name: DEVICE_CERT_COUNTRY
              Value: US
            - Name: DEVICE_CERT_ORG
              Value: HealthSimulator
            - Name: DEFAULT_HTTP_ENDPOINTS
              Value: !Ref DefaultHttpEndpoints
            - Name: DEFAULT_MQTT_BROKER_URL
              Value: !Ref DefaultMqttBrokerUrl
            - Name: DEFAULT_MQTT_TOPIC
              Value: !Ref DefaultMqttTopic
            - Name: DEFAULT_BATCH_SIZE
              Value: !Sub "${DefaultBatchSize}"
            - Name: DEFAULT_INTERVAL_SECONDS
              Value: !Sub "${DefaultIntervalSeconds}"
            - Name: DEFAULT_MAX_DEVICES
              Value: !Sub "${DefaultMaxDevices}"
            - Name: DEFAULT_ANOMALY_RATE
              Value: !Ref DefaultAnomalyRate
            - Name: INGESTION_API_KEY
              Value: !Ref IngestionApiKey
          Secrets:
            - Name: APP_CONFIG_SECRET
              ValueFrom: !Ref AppConfigSecret
            - Name: CA_CERT_PEM
              ValueFrom: !Ref CACertPemSecret
            - Name: CA_KEY_PEM
              ValueFrom: !Ref CAKeyPemSecret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BackendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend
          HealthCheck:
            Command:
              - CMD-SHELL
              - "curl -sf http://localhost:8000/health || exit 1"
            Interval: 30
            Timeout: 5
            Retries: 3
            # seed can take ~30–60 s on cold start (schema is created inline, no migrations)
            StartPeriod: 90

# ─── Outputs ──────────────────────────────────────────────────────────────────

Outputs:

  AppConfigSecretArn:
    Description: ARN of the app configuration secret.
    Value: !Ref AppConfigSecret
    Export:
      Name: !Sub "${AWS::StackName}:AppConfigSecretArn"

  CACertPemSecretArn:
    Description: ARN of the CA certificate secret — populate with bootstrap.sh before first deploy.
    Value: !Ref CACertPemSecret
    Export:
      Name: !Sub "${AWS::StackName}:CACertPemSecretArn"

  CAKeyPemSecretArn:
    Description: ARN of the CA private key secret — populate with bootstrap.sh before first deploy.
    Value: !Ref CAKeyPemSecret
    Export:
      Name: !Sub "${AWS::StackName}:CAKeyPemSecretArn"

  ECSClusterName:
    Description: ECS cluster name — passed to 05-service and used by GitHub Actions.
    Value: !Ref ECSCluster
    Export:
      Name: !Sub "${AWS::StackName}:ECSClusterName"

  BackendTaskDefinitionFamily:
    Description: ECS task definition family name — passed to 05-service.
    Value: !Sub "${ProjectName}-backend"
    Export:
      Name: !Sub "${AWS::StackName}:BackendTaskDefinitionFamily"

  BackendTargetGroupArn:
    Description: ALB target group ARN — passed to 05-service for load balancer attachment.
    Value: !Ref BackendTargetGroup
    Export:
      Name: !Sub "${AWS::StackName}:BackendTargetGroupArn"

  ALBDNSName:
    Description: ALB DNS name — used as CloudFront origin for /api/* and /health.
    Value: !GetAtt ALB.DNSName
    Export:
      Name: !Sub "${AWS::StackName}:ALBDNSName"
