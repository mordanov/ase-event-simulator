AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Health Telemetry Simulator — ACM certificate for CloudFront.
  IMPORTANT: This stack MUST be deployed in us-east-1 regardless of the
  application region, because CloudFront only accepts certificates from
  us-east-1.  bootstrap.sh handles this automatically.

# ─── Parameters ───────────────────────────────────────────────────────────────

Parameters:

  DomainName:
    Type: String
    Description: >
      Public hostname for the simulator, e.g. event-simulator.somedomain.com.
      An ACM certificate covering exactly this name will be issued.

  IngestionDomainName:
    Type: String
    Default: "ingestion-pipeline.aleksandr-mordanov.click"
    Description: >
      Public hostname for the ingestion pipeline CloudFront distribution.
      A separate ACM certificate is required because CloudFront validates the
      certificate CN/SAN against the distribution alias.

  WildcardDomainName:
    Type: String
    Default: "*.aleksandr-mordanov.click"
    Description: >
      Wildcard certificate covering all first-level subdomains (grafana, prometheus, etc.).
      Shared across multiple CloudFront distributions.

  HostedZoneId:
    Type: String
    Description: >
      Route 53 hosted zone ID for both domains above.
      CloudFormation uses it to create DNS validation CNAMEs automatically.

# ─── Resources ────────────────────────────────────────────────────────────────

Resources:

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  IngestionCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref IngestionDomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref IngestionDomainName
          HostedZoneId: !Ref HostedZoneId

  WildcardCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref WildcardDomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref WildcardDomainName
          HostedZoneId: !Ref HostedZoneId

# ─── Outputs ──────────────────────────────────────────────────────────────────

Outputs:

  CertificateArn:
    Description: ARN of the simulator ACM certificate (pass to 07-cdn.yaml as CertificateArn).
    Value: !Ref Certificate
    Export:
      Name: !Sub "${AWS::StackName}:CertificateArn"

  IngestionCertificateArn:
    Description: ARN of the ingestion pipeline ACM certificate (pass to 07-cdn.yaml as IngestionCertificateArn).
    Value: !Ref IngestionCertificate
    Export:
      Name: !Sub "${AWS::StackName}:IngestionCertificateArn"

  WildcardCertificateArn:
    Description: ARN of the wildcard ACM certificate for *.aleksandr-mordanov.click (pass to 07-cdn.yaml as WildcardCertificateArn).
    Value: !Ref WildcardCertificate
    Export:
      Name: !Sub "${AWS::StackName}:WildcardCertificateArn"
