AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Health Telemetry Simulator — persistent resources.
  ECR repository uses DeletionPolicy:Retain so it survives platform stack
  recreations without causing "already exists" errors.

# ─── Parameters ───────────────────────────────────────────────────────────────

Parameters:

  ProjectName:
    Type: String
    Default: health-simulator

# ─── Resources ────────────────────────────────────────────────────────────────

Resources:

  # ══ ECR ═══════════════════════════════════════════════════════════════════

  ECRRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub "${ProjectName}-backend"
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Keep last 10 images",
              "selection": {
                "tagStatus": "any",
                "countType": "imageCountMoreThan",
                "countNumber": 10
              },
              "action": { "type": "expire" }
            }]
          }

# ─── Outputs ──────────────────────────────────────────────────────────────────

Outputs:

  ECRRepositoryUri:
    Description: ECR repository URI — push backend images here.
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ECRRepository}"
    Export:
      Name: !Sub "${AWS::StackName}:ECRRepositoryUri"
