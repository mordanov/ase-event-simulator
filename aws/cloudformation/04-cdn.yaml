AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Health Telemetry Simulator — CloudFront distribution + Route 53 record.
  Routing:
    /api/*    → ALB (ECS backend, caching disabled)
    /health   → ALB (caching disabled)
    /*        → S3  (React SPA, caching optimised)
  A CloudFront Function rewrites sub-routes (e.g. /devices) to /index.html
  so the SPA router handles them without requiring a file at that key.

# ─── Parameters ───────────────────────────────────────────────────────────────

Parameters:

  DomainName:
    Type: String
    Description: Public hostname, e.g. event-simulator.somedomain.com.

  HostedZoneId:
    Type: String
    Description: Route 53 hosted zone ID for DomainName.

  CertificateArn:
    Type: String
    Description: >
      ACM certificate ARN (from 03-acm stack, must be in us-east-1).

  BackendAlbDns:
    Type: String
    Description: ALB DNS name from 02-platform stack (ALBDNSName output).

  FrontendBucketName:
    Type: String
    Description: S3 bucket name for frontend static files (from 00-buckets stack).

  FrontendBucketArn:
    Type: String
    Description: S3 bucket ARN for frontend static files (from 00-buckets stack).

  PriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues:
      - PriceClass_100   # US, Canada, Europe
      - PriceClass_200   # + Asia, Middle East, Africa
      - PriceClass_All
    Description: CloudFront price class (controls which edge locations are used).

# ─── Resources ────────────────────────────────────────────────────────────────

Resources:

  # ── Origin Access Control (OAC) for S3 ────────────────────────────────────

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-frontend-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ── S3 bucket policy — allow CloudFront OAC to read ───────────────────────

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucketName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucketArn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub
                  - "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistId}"
                  - DistId: !Ref CloudFrontDistribution

  # ── CloudFront Function — SPA route rewriting ─────────────────────────────
  # Rewrites paths that have no file extension (e.g. /devices, /sessions/abc)
  # to /index.html so the React router can handle them.
  # Requests to /api/*, /health, and static assets pass through unchanged.

  SPARouterFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-spa-router"
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite SPA sub-routes to /index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          // Pass through requests that look like static files (have an extension)
          // or that target the backend (/api/*, /health)
          if (uri.startsWith('/api/') || uri === '/health' || uri.includes('.')) {
            return request;
          }
          // Rewrite all other paths to the SPA entry point
          request.uri = '/index.html';
          return request;
        }

  # ── CloudFront distribution ────────────────────────────────────────────────

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "Health Telemetry Simulator — ${DomainName}"
        Aliases:
          - !Ref DomainName
        PriceClass: !Ref PriceClass
        HttpVersion: http2and3
        DefaultRootObject: index.html

        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

        Origins:
          # S3 origin for React static assets
          - Id: frontend-s3
            DomainName: !Sub "${FrontendBucketName}.s3.${AWS::Region}.amazonaws.com"
            S3OriginConfig:
              OriginAccessIdentity: ""   # unused — OAC replaces OAI
            OriginAccessControlId: !GetAtt FrontendOAC.Id

          # ALB origin for the FastAPI backend
          - Id: backend-alb
            DomainName: !Ref BackendAlbDns
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only   # ALB listener is HTTP; CloudFront handles HTTPS externally

        # Default behaviour: serve the React SPA from S3
        DefaultCacheBehavior:
          TargetOriginId: frontend-s3
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # Managed-CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SPARouterFunction.FunctionARN

        CacheBehaviors:
          # Backend API — no caching, forward all methods
          - PathPattern: "/api/*"
            TargetOriginId: backend-alb
            ViewerProtocolPolicy: https-only
            Compress: false
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            # Managed-CachingDisabled
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # Managed-AllViewerExceptHostHeader (forwards query strings, cookies, all headers except Host)
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

          # Health-check endpoint — no caching
          - PathPattern: "/health"
            TargetOriginId: backend-alb
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            # Managed-CachingDisabled
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad

  # ── Route 53 A record — alias to CloudFront ───────────────────────────────

  DNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        # CloudFront's fixed hosted zone ID (constant for all distributions)
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        EvaluateTargetHealth: false

# ─── Outputs ──────────────────────────────────────────────────────────────────

Outputs:

  CloudFrontDistributionId:
    Description: >
      CloudFront distribution ID — used by GitHub Actions to invalidate the
      cache after a frontend deployment (aws cloudfront create-invalidation).
    Value: !Ref CloudFrontDistribution
    Export:
      Name: !Sub "${AWS::StackName}:CloudFrontDistributionId"

  CloudFrontDomain:
    Description: CloudFront-assigned domain name (before custom DNS propagates).
    Value: !GetAtt CloudFrontDistribution.DomainName
    Export:
      Name: !Sub "${AWS::StackName}:CloudFrontDomain"

  SiteURL:
    Description: Public URL of the deployed simulator.
    Value: !Sub "https://${DomainName}"
    Export:
      Name: !Sub "${AWS::StackName}:SiteURL"
