version: "3.9"

services:
  # ── PostgreSQL device registry ───────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: simulator-db
    environment:
      POSTGRES_USER: simulator
      POSTGRES_PASSWORD: simulator
      POSTGRES_DB: simulator
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simulator -d simulator"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Python FastAPI backend ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: simulator-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - DATABASE_URL=postgresql+asyncpg://simulator:simulator@db:5432/simulator
    volumes:
      - ./backend/app:/app/app   # hot-reload in dev
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ── React frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # In Docker, backend is reached via the nginx proxy, not localhost
        VITE_API_BASE_URL: ""
    container_name: simulator-frontend
    ports:
      - "3002:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:

networks:
  default:
    name: simulator-net
