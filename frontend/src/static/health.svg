<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <style>
      .bg { fill: #0b1220; }
      .frame { stroke: #1e293b; stroke-width: 16; fill: none; }
      .primary { stroke: #4ade80; stroke-width: 20; fill: none; stroke-linecap: round; }
      .soft { stroke: #4ade80; stroke-opacity: 0.25; stroke-width: 12; fill: none; }
      .accent { fill: #4ade80; }
    </style>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect class="bg" width="512" height="512" rx="96"/>
  <rect class="frame" x="24" y="24" width="464" height="464" rx="80"/>
  <g filter="url(#glow)">
    <path class="primary" d="M256 384 C220 340, 140 280, 140 220 A48 48 0 0 1 256 200 A48 48 0 0 1 372 220 C372 280, 292 340, 256 384"/>
  </g>
  <line class="soft" x1="208" y1="208" x2="208" y2="304"/>
  <line class="soft" x1="304" y1="208" x2="304" y2="304"/>
  <line class="soft" x1="208" y1="256" x2="304" y2="256"/>
  <polyline class="primary" points="160,272 208,240 240,300 288,208 352,240"/>
  <circle class="accent" cx="208" cy="240" r="8"/>
  <circle class="accent" cx="288" cy="208" r="8"/>
  <circle class="accent" cx="352" cy="240" r="8"/>
</svg>